<title>莱宝福禅拍工作室 · iPad工作台</title>
<style>
:root{
--bg:#f0f7f0;--bg-card:#fff;--bg-sidebar:#e8f3e8;--bg-hover:#dfe9df;--bg-active:#c9dec9;
--text-1:#1a3320;--text-2:#3d5a42;--text-3:#6b8a70;--text-4:#a0b8a4;
--accent:#4caf50;--accent-light:#81c784;--accent-bg:#e8f5e9;--accent-text:#2e7d32;
--warm:#b8a088;--warm-bg:#f0ebe5;--cool:#8a9ba8;--cool-bg:#e8eef2;
--muted:#a89c8e;--muted-bg:#f0ece6;--rose:#b89a9a;--rose-bg:#f0e8e8;--gold:#b8a06e;--gold-bg:#f2eee0;
--border:#d4e4d4;--border-light:#e0ece0;
--shadow-sm:0 1px 3px rgba(46,125,50,.04);--shadow-md:0 4px 12px rgba(46,125,50,.08);--shadow-lg:0 8px 24px rgba(46,125,50,.1);
--r-sm:6px;--r-md:10px;--r-lg:14px;
--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--sidebar-w:240px;--topbar-h:60px;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text-1);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-top)}
.brand{padding:24px 20px 20px;border-bottom:1px solid var(--border-light);text-align:center}
.brand-logo{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:300}
.brand-name{font-size:15px;font-weight:500;letter-spacing:1px;margin-bottom:3px}
.brand-slogan{font-size:10px;color:var(--text-3);letter-spacing:2px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:16px 12px}.nav::-webkit-scrollbar{width:0}
.nav-section{margin-bottom:20px}
.nav-section-title{font-size:10px;color:var(--text-4);letter-spacing:2px;padding:0 12px 8px;text-transform:uppercase;font-weight:500}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-sm);font-size:13px;color:var(--text-2);cursor:pointer;margin-bottom:2px;transition:background .15s;position:relative;min-height:46px}
.nav-item:hover{background:var(--bg-hover);color:var(--text-1)}
.nav-item.active{background:var(--bg-active);color:var(--text-1);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.5}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border-light);text-align:center;font-size:10px;color:var(--text-4);padding-bottom:calc(16px + var(--safe-bottom))}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:calc(var(--topbar-h) + var(--safe-top));flex-shrink:0;display:flex;align-items:flex-end;padding:0 32px;border-bottom:1px solid var(--border);background:var(--bg)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;width:100%;height:var(--topbar-h)}
.topbar-left{display:flex;align-items:center;gap:12px}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:var(--r-sm);background:transparent;border:none;color:var(--text-2);cursor:pointer;align-items:center;justify-content:center}
.breadcrumb{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.breadcrumb .crumb-link{cursor:pointer}.breadcrumb .crumb-link:hover{color:var(--accent-text)}
.breadcrumb .current{color:var(--text-1);font-weight:500;font-size:15px}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:12px;color:var(--text-3);padding:9px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px}
.content{flex:1;overflow-y:auto;padding:28px 32px calc(40px + var(--safe-bottom))}.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.page-header{margin-bottom:24px}
.page-header-row{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.page-header-row .page-title{margin-bottom:0;flex:1}
.page-title{font-size:22px;font-weight:500;color:var(--text-1);letter-spacing:-.5px;margin-bottom:4px}
.page-desc{font-size:13px;color:var(--text-3)}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text-1);outline:none;font-family:var(--font);min-height:44px}.search-input::placeholder{color:var(--text-4)}.search-input:focus{border-color:var(--accent-light)}
.btn{padding:12px 20px;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);transition:background .15s;white-space:nowrap;min-height:44px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-text)}
.btn-ghost{background:var(--bg-card);color:var(--text-2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg-hover);color:var(--text-1)}
.btn-solid{background:var(--accent);color:#fff}.btn-solid:hover{background:var(--accent-text)}
.btn-line{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-line:hover{background:var(--bg-hover)}
.btn-danger{background:transparent;color:var(--rose);border:1px solid var(--rose)}.btn-danger:hover{background:var(--rose-bg)}
.btn svg{width:16px;height:16px}
.filter-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.filter-tab{padding:10px 18px;border-radius:999px;font-size:12px;color:var(--text-3);cursor:pointer;transition:all .15s;border:1px solid transparent;min-height:40px;display:flex;align-items:center}.filter-tab:hover{color:var(--text-1)}.filter-tab.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-light);font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;transition:box-shadow .2s}.stat-card:hover{box-shadow:var(--shadow-sm)}
.stat-label{font-size:12px;color:var(--text-3);margin-bottom:10px}
.stat-value{font-size:26px;font-weight:400;color:var(--text-1);display:flex;align-items:baseline;gap:4px;letter-spacing:-.5px}
.stat-unit{font-size:13px;color:var(--text-3)}
.stat-trend{font-size:11px;color:var(--accent-text);margin-top:8px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title{font-size:16px;font-weight:500;color:var(--text-1)}
.section-more{font-size:12px;color:var(--text-3);cursor:pointer}.section-more:hover{color:var(--accent-text)}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;min-height:52px}.list-item:hover{border-color:var(--accent-light);box-shadow:var(--shadow-sm)}
.list-item.no-hover{cursor:default}.list-item.no-hover:hover{border-color:var(--border);box-shadow:none}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.avatar-sm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:500;color:var(--text-1);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-meta{font-size:12px;color:var(--text-3);display:flex;gap:12px;flex-wrap:wrap}
.item-amount{font-size:15px;font-weight:500;color:var(--text-1)}
.item-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.item-action-btn{min-width:44px;min-height:36px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-card);color:var(--text-2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:var(--font)}.item-action-btn:hover{background:var(--bg-hover);color:var(--text-1)}
.item-action-btn.primary{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-light)}
.item-action-btn.danger{color:var(--rose);border-color:var(--rose)}.item-action-btn.danger:hover{background:var(--rose-bg)}
.tag{font-size:10px;padding:2px 8px;border-radius:999px}.tag-green{background:var(--accent-bg);color:var(--accent-text)}.tag-blue{background:var(--cool-bg);color:#6a7d8a}.tag-warm{background:var(--warm-bg);color:#9a8268}.tag-rose{background:var(--rose-bg);color:#9a7a7a}.tag-gold{background:var(--gold-bg);color:#9a8458}.tag-gray{background:var(--bg-hover);color:var(--text-3)}
.status{font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap}.status-pending{background:var(--gold-bg);color:#9a8458}.status-confirmed{background:var(--accent-bg);color:var(--accent-text)}.status-done{background:var(--bg-hover);color:var(--text-3)}.status-cancel{background:var(--rose-bg);color:#9a7a7a}
.empty{background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--r-md);padding:60px 20px;text-align:center;color:var(--text-4);font-size:13px}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;opacity:.3}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-bottom:28px}
.quick-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .15s}.quick-item:hover{border-color:var(--accent-light);box-shadow:var(--shadow-sm)}
.quick-icon{width:44px;height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center}.quick-icon svg{width:22px;height:22px;stroke-width:1.5}
.quick-label{font-size:12px;color:var(--text-2);text-align:center}
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 16px;font-weight:500;color:var(--text-3);font-size:12px;border-bottom:1px solid var(--border);background:var(--bg-sidebar);white-space:nowrap}
td{padding:15px 16px;color:var(--text-2);border-bottom:1px solid var(--border-light)}tr:last-child td{border-bottom:none}tbody tr:hover td{background:var(--bg-hover)}
.hero{background:linear-gradient(135deg,var(--accent-bg) 0%,var(--warm-bg) 100%);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 32px;margin-bottom:28px}
.hero-greeting{font-size:12px;color:var(--accent-text);margin-bottom:6px}
.hero-title{font-size:24px;font-weight:400;letter-spacing:1px;line-height:1.4}
.hero-quote{font-size:13px;color:var(--text-2);margin-top:10px;font-style:italic;line-height:1.6;opacity:.85}
.hero-sub{font-size:13px;color:var(--text-3);margin-top:8px}
.form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;max-width:680px}
.form-section-title{font-size:13px;font-weight:500;color:var(--accent-text);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border-light)}
.form-actions{display:flex;gap:12px;max-width:680px}.form-actions .btn{flex:1;justify-content:center}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:var(--text-3);margin-bottom:6px;font-weight:500}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text-1);outline:none;font-family:var(--font);min-height:44px}.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent-light)}
.form-textarea{resize:vertical;min-height:64px}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.form-hint{font-size:11px;color:var(--text-4);margin-top:4px}
.calc-box{background:var(--accent-bg);border:1px solid var(--accent-light);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px}
.calc-box .form-hint{color:var(--accent-text);font-weight:500}
.sub-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.sub-tab{padding:10px 20px;font-size:13px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-height:44px;display:flex;align-items:center}
.sub-tab:hover{color:var(--text-1)}
.sub-tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500}
.record-list{margin-top:12px}
.record-item{background:var(--bg);border:1px solid var(--border-light);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.record-item-info{flex:1}
.record-item-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.inline-add-btn{margin-top:8px;width:100%;padding:10px;border:1px dashed var(--accent-light);border-radius:var(--r-sm);background:transparent;color:var(--accent-text);font-size:12px;cursor:pointer;font-family:var(--font);min-height:40px}

<script>
// ============ 日历组件 ============
let rcCalTarget=null,rcCalDate=new Date(),rcCalSelected=null;
function rcOpenCalendar(inputId){
const input=document.getElementById(inputId);if(!input)return;
rcCalTarget=input;
const val=input.value;
if(val){const d=new Date(val);if(!isNaN(d))rcCalDate=d;else rcCalDate=new Date()}
else rcCalDate=new Date();
rcCalSelected=val;
rcRenderCalendar();
}
function rcRenderCalendar(){
let overlay=document.getElementById('rcCalendarOverlay');
if(!overlay){overlay=document.createElement('div');overlay.id='rcCalendarOverlay';overlay.className='rc-calendar-overlay';document.body.appendChild(overlay)}
const y=rcCalDate.getFullYear(),m=rcCalDate.getMonth();
const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const today=new Date().toISOString().split('T')[0];
const firstDay=new Date(y,m,1).getDay();
const daysInMonth=new Date(y,m+1,0).getDate();
const prevDays=new Date(y,m,0).getDate();
let daysHtml='';
for(let i=firstDay-1;i>=0;i--){daysHtml+=`<div class="rc-cal-day rc-other">${prevDays-i}</div>`}
for(let d=1;d<=daysInMonth;d++){
const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
let cls='rc-cal-day';
if(dateStr===today)cls+=' rc-today';
if(dateStr===rcCalSelected)cls+=' rc-selected';
daysHtml+=`<div class="${cls}" onclick="rcSelectDay('${dateStr}')">${d}</div>`
}
const totalCells=firstDay+daysInMonth;
const remain=(7-totalCells%7)%7;
for(let d=1;d<=remain;d++){daysHtml+=`<div class="rc-cal-day rc-other">${d}</div>`}
overlay.innerHTML=`<div class="rc-calendar"><div class="rc-cal-header"><div class="rc-cal-title">${y}年${monthNames[m]}</div><div class="rc-cal-nav"><button onclick="rcCalPrev()">‹</button><button onclick="rcCalToday()">今</button><button onclick="rcCalNext()">›</button></div></div><div class="rc-cal-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="rc-cal-days">${daysHtml}</div><div class="rc-cal-actions"><button class="rc-cal-cancel" onclick="rcCloseCalendar()">取消</button><button class="rc-cal-ok" onclick="rcConfirmCalendar()">确定</button></div></div>`;
overlay.style.display='flex';
overlay.onclick=(e)=>{if(e.target===overlay)rcCloseCalendar()};
}
function rcSelectDay(dateStr){rcCalSelected=dateStr;rcRenderCalendar()}
function rcCalPrev(){rcCalDate.setMonth(rcCalDate.getMonth()-1);rcRenderCalendar()}
function rcCalNext(){rcCalDate.setMonth(rcCalDate.getMonth()+1);rcRenderCalendar()}
function rcCalToday(){rcCalDate=new Date();rcCalSelected=new Date().toISOString().split('T')[0];rcRenderCalendar()}
function rcCloseCalendar(){const o=document.getElementById('rcCalendarOverlay');if(o)o.style.display='none'}
function rcConfirmCalendar(){if(rcCalSelected&&rcCalTarget){rcCalTarget.value=rcCalSelected}rcCloseCalendar()}

function calcThird(changed,durationField,priceField,totalField){
const d=parseFloat(document.getElementById(durationField)?.value);
const p=parseFloat(document.getElementById(priceField)?.value);
const t=parseFloat(document.getElementById(totalField)?.value);
if(changed==='duration'&&d&&p)document.getElementById(totalField).value=Math.round(d*p*100)/100;
else if(changed==='price'&&d&&p)document.getElementById(totalField).value=Math.round(d*p*100)/100;
else if(changed==='total'&&d&&t)document.getElementById(priceField).value=Math.round(t/d*100)/100;
else if(changed==='total'&&p&&t)document.getElementById(durationField).value=Math.round(t/p*100)/100;
}

let sigCanvas,sigCtx,sigDrawing=false,sigHasContent=false;
function initSignature(canvasId,existingData){
const canvas=document.getElementById(canvasId);if(!canvas)return;
sigCanvas=canvas;sigCtx=canvas.getContext('2d');
const rect=canvas.getBoundingClientRect();canvas.width=rect.width*2;canvas.height=rect.height*2;sigCtx.scale(2,2);
sigCtx.strokeStyle='#2c2825';sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.lineJoin='round';
sigHasContent=false;
if(existingData){const img=new Image();img.onload=()=>{sigCtx.drawImage(img,0,0,rect.width,rect.height);sigHasContent=true;hideSigPlaceholder(canvasId)};img.src=existingData}
canvas.addEventListener('mousedown',sigStart);canvas.addEventListener('mousemove',sigMove);canvas.addEventListener('mouseup',sigEnd);canvas.addEventListener('mouseleave',sigEnd);
canvas.addEventListener('touchstart',e=>{e.preventDefault();sigStart(e.touches[0])},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();sigMove(e.touches[0])},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();sigEnd()},{passive:false});
// 双击全屏签名
canvas.addEventListener('dblclick',()=>openFullSignature(canvasId));
}
function sigStart(e){sigDrawing=true;sigCtx.beginPath();const r=sigCanvas.getBoundingClientRect();sigCtx.moveTo(e.clientX-r.left,e.clientY-r.top);hideSigPlaceholder(sigCanvas.id)}
function sigMove(e){if(!sigDrawing)return;const r=sigCanvas.getBoundingClientRect();sigCtx.lineTo(e.clientX-r.left,e.clientY-r.top);sigCtx.stroke();sigHasContent=true}
function sigEnd(){sigDrawing=false}
function hideSigPlaceholder(id){const p=document.querySelector(`#${id}+.signature-placeholder`);if(p)p.style.display='none'}
function clearSignature(id){const canvas=document.getElementById(id);if(!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);sigHasContent=false;const p=document.querySelector(`#${id}+.signature-placeholder`);if(p)p.style.display='flex';showToast('签名已清除')}
function getSignatureData(){return sigHasContent?sigCanvas.toDataURL():''}

// ============ 全屏签名（双击触发）============
let fullSigOriginCanvasId=null,fullSigCtx=null,fullSigDrawing=false,fullSigHasContent=false;
function openFullSignature(canvasId){
fullSigOriginCanvasId=canvasId;
const overlay=document.getElementById('fullSigOverlay');
const canvas=document.getElementById('fullSigCanvas');
const placeholder=document.getElementById('fullSigPlaceholder');
overlay.classList.add('show');
// 初始化全屏 canvas
const rect=document.getElementById('fullSigBox').getBoundingClientRect();
canvas.width=rect.width*2;canvas.height=rect.height*2;
fullSigCtx=canvas.getContext('2d');
fullSigCtx.scale(2,2);
fullSigCtx.strokeStyle='#2c2825';fullSigCtx.lineWidth=2.5;fullSigCtx.lineCap='round';fullSigCtx.lineJoin='round';
fullSigHasContent=false;
if(placeholder)placeholder.style.display='flex';
// 如果原签名板已有内容，复制到全屏
const origCanvas=document.getElementById(canvasId);
if(origCanvas&&origCanvas.toDataURL().length>100){
const img=new Image();img.onload=()=>{fullSigCtx.drawImage(img,0,0,rect.width,rect.height);fullSigHasContent=true;if(placeholder)placeholder.style.display='none'};img.src=origCanvas.toDataURL()
}
// 绑定事件（先移除旧的再绑定，避免重复）
canvas.onmousedown=fullSigStart;canvas.onmousemove=fullSigMove;canvas.onmouseup=fullSigEnd;canvas.onmouseleave=fullSigEnd;
canvas.ontouchstart=e=>{e.preventDefault();fullSigStart(e.touches[0])};
canvas.ontouchmove=e=>{e.preventDefault();fullSigMove(e.touches[0])};
canvas.ontouchend=e=>{e.preventDefault();fullSigEnd()};
// 双击全屏区域关闭
overlay.ondblclick=(e)=>{if(e.target===overlay)closeFullSignature(true)};
}
function fullSigStart(e){
fullSigDrawing=true;fullSigCtx.beginPath();
const r=document.getElementById('fullSigCanvas').getBoundingClientRect();
fullSigCtx.moveTo(e.clientX-r.left,e.clientY-r.top);
const p=document.getElementById('fullSigPlaceholder');if(p)p.style.display='none';
}
function fullSigMove(e){
if(!fullSigDrawing)return;
const r=document.getElementById('fullSigCanvas').getBoundingClientRect();
fullSigCtx.lineTo(e.clientX-r.left,e.clientY-r.top);
fullSigCtx.stroke();fullSigHasContent=true;
}
function fullSigEnd(){fullSigDrawing=false}
function clearFullSignature(){
const canvas=document.getElementById('fullSigCanvas');if(!canvas)return;
fullSigCtx.clearRect(0,0,canvas.width,canvas.height);
fullSigHasContent=false;
const p=document.getElementById('fullSigPlaceholder');if(p)p.style.display='flex';
}
function closeFullSignature(confirm){
const overlay=document.getElementById('fullSigOverlay');
overlay.classList.remove('show');
if(confirm&&fullSigHasContent&&fullSigOriginCanvasId){
// 将全屏签名数据写回原签名板
const origCanvas=document.getElementById(fullSigOriginCanvasId);
if(origCanvas){
const ctx=origCanvas.getContext('2d');
const rect=origCanvas.getBoundingClientRect();
ctx.clearRect(0,0,origCanvas.width,origCanvas.height);
const img=new Image();img.onload=()=>{
ctx.drawImage(img,0,0,rect.width,rect.height);
sigHasContent=true;
const p=document.querySelector(`#${fullSigOriginCanvasId}+.signature-placeholder`);if(p)p.style.display='none';
};img.src=document.getElementById('fullSigCanvas').toDataURL();
}
}
fullSigOriginCanvasId=null;fullSigDrawing=false;
}

let list=DB.appointments;if(aptFilter!=='all')list=list.filter(a=>(a.status||'pending')===aptFilter);

const sm={pending:['待服务','status-pending'],confirmed:['已确认','status-confirmed'],done:['已完成','status-done'],cancel:['已取消','status-cancel']};
c.innerHTML=list.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(a=>{const cu=DB.customers.find(x=>x.id===a.custId);const[sl,sc]=sm[a.status||'pending']||['待服务','status-pending'];const ck=aptSelected.includes(a.id);return `<div class="list-item" ${aptBatchMode?`onclick="toggleAptSelect(${a.id})"`:`onclick="navigate('appointment-detail',{id:${a.id}})"`}>${aptBatchMode?`<input type="checkbox" ${ck?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)" onclick="toggleAptSelect(${a.id})">`:''}<div class="avatar" style="background:var(--accent)">${(cu?.name||'?')[0]}</div><div class="item-info"><div class="item-name">${cu?cu.name:'已删除'} <span class="tag tag-green">${a.duration||0}小时</span> ${a.custType==='会员'?'<span class="tag tag-gold">会员</span>':'<span class="tag tag-gray">非会员</span>'}</div><div class="item-meta"><span>${a.date} ${a.time}</span><span>¥${a.totalPrice||0}</span></div></div><span class="status ${sc}">${sl}</span></div>`}).join('');
}

function updateAptStatus(id,status){
const a=DB.appointments.find(x=>x.id===id);if(!a)return;
if(status==='done'&&a.custType==='会员'){
const result=autoDeductOnComplete(a);
if(!result.ok){showToast(result.msg);return}
a.status=status;saveDB();
// 完成服务后弹出服务记录填写
showServiceRecordForm(id,()=>{renderAppointmentDetail({id})});
}else if(status==='done'&&a.custType==='非会员'){
// 弹出三选一选择：充卡后完成 / 直接收款完成 / 取消
showCompleteChoice(id);
}else{
a.status=status;saveDB();showToast('状态已更新');renderAppointmentDetail({id});
}
}

// 临时散客充卡：先按名字查找已有客户，没有则自动创建并升级为会员

// 会员完成预约时 FIFO 自动扣卡
function autoDeductOnComplete(apt){
const custRecharges=DB.recharges.filter(r=>r.custId===apt.custId).sort((a,b)=>a.date.localeCompare(b.date));
if(!custRecharges.length)return{ok:false,msg:'该会员暂无充值记录，请先充值'};
const needHours=apt.duration||0;
const totalRemain=custRecharges.reduce((s,r)=>s+calcRechargeRemaining(r.id).remainHours,0);
if(totalRemain<needHours)return{ok:false,msg:`充值余额不足（需${needHours}h，剩余${totalRemain.toFixed(1)}h），请先充值`};
let targetRc=null;
for(const r of custRecharges){const rem=calcRechargeRemaining(r.id);if(rem.remainHours>0){targetRc=r;break}}
if(!targetRc)return{ok:false,msg:'无可用充值余额'};
const cust=DB.customers.find(c=>c.id===apt.custId);
const st=apt.staffId?DB.staff.find(s=>s.id===apt.staffId):null;
DB.deductions.push({id:Date.now(),custId:apt.custId,rechargeId:targetRc.id,customer:cust?cust.name:'',hours:apt.duration||0,unitPrice:apt.unitPrice||0,totalPrice:apt.totalPrice||0,staff:st?st.name:'',date:new Date().toISOString().split('T')[0],note:'预约完成自动扣卡',payMethod:'储卡'});
return{ok:true};
}

// ============ 4. 充值记录（原会员扣卡，重构）============
// 计算指定充值记录的剩余时长和剩余金额（实时计算，不存储）
function calcRechargeRemaining(rechargeId){
const r=DB.recharges.find(x=>x.id===rechargeId);
if(!r)return{remainHours:0,remainAmount:0,totalHours:0,deductedHours:0,deductedAmount:0};
const rel=DB.deductions.filter(d=>d.rechargeId===rechargeId);
const dh=rel.reduce((s,d)=>s+(d.hours||0),0);
const da=rel.reduce((s,d)=>s+(d.totalPrice||0),0);
return{remainHours:Math.max(0,(r.hours||0)+(r.giftHours||0)-dh),remainAmount:Math.max(0,(r.amount||0)-da),totalHours:(r.hours||0)+(r.giftHours||0),deductedHours:dh,deductedAmount:da};
}
function renderRecharge(){
const totalRecharge=DB.recharges.reduce((s,r)=>s+(r.hours||0),0);
const totalGift=DB.recharges.reduce((s,r)=>s+(r.giftHours||0),0);
const memberDeductions=DB.deductions.filter(d=>d.rechargeId);
const nonMemberDeductions=DB.deductions.filter(d=>!d.rechargeId);
const totalDeduct=memberDeductions.reduce((s,d)=>s+(d.hours||0),0);
const totalRemain=totalRecharge+totalGift-totalDeduct;
const totalRevenue=DB.deductions.reduce((s,d)=>s+(d.totalPrice||0),0);
const nonMemRevenue=nonMemberDeductions.reduce((s,d)=>s+(d.totalPrice||0),0);
const totalRemainAmount=DB.recharges.reduce((s,r)=>s+calcRechargeRemaining(r.id).remainAmount,0);
document.getElementById('content').innerHTML=`
<div class="page-header"><div class="page-title">消费分类</div><div class="page-desc">充值记录 · 扣卡记录 · 非会员消费 · 剩余自动管理</div></div>
<div class="stat-grid">
<div class="stat-card"><div class="stat-label">总充值时长</div><div class="stat-value">${totalRecharge}<span class="stat-unit">小时</span></div></div>
<div class="stat-card"><div class="stat-label">总赠送时长</div><div class="stat-value">${totalGift}<span class="stat-unit">小时</span></div></div>
<div class="stat-card"><div class="stat-label">总扣除时长</div><div class="stat-value">${totalDeduct}<span class="stat-unit">小时</span></div></div>
<div class="stat-card"><div class="stat-label">当前剩余总时长</div><div class="stat-value" style="color:var(--accent-text)">${totalRemain}<span class="stat-unit">小时</span></div></div>
<div class="stat-card"><div class="stat-label">会员消费营收</div><div class="stat-value">¥${(totalRevenue-nonMemRevenue).toLocaleString()}</div></div>
<div class="stat-card"><div class="stat-label">非会员消费营收</div><div class="stat-value" style="color:var(--warm)">¥${nonMemRevenue.toLocaleString()}</div></div>

function onDeductCustChange(){
const custId=parseInt(document.getElementById('deductCust').value);

if(!custId){sel.innerHTML='<option value="">请先选择客户</option>';info.style.display='none';return}
const custRecharges=DB.recharges.filter(r=>r.custId===custId).sort((a,b)=>a.date.localeCompare(b.date));
if(!custRecharges.length){sel.innerHTML='<option value="">该客户暂无充值记录</option>';info.style.display='block';txt.textContent='⚠️ 该客户暂无充值记录，请先新增充值';return}
sel.innerHTML='<option value="">请选择充值记录</option>'+custRecharges.map(r=>{const rem=calcRechargeRemaining(r.id);const tag=rem.remainHours<=0?'（已用完）':`（剩余 ${rem.remainHours.toFixed(1)}h / ¥${rem.remainAmount.toFixed(0)}）`;return `<option value="${r.id}">${r.date} ${r.cardType} ${r.hours}h${tag}</option>`}).join('');
const tH=custRecharges.reduce((s,r)=>s+calcRechargeRemaining(r.id).remainHours,0);
const tA=custRecharges.reduce((s,r)=>s+calcRechargeRemaining(r.id).remainAmount,0);
info.style.display='block';txt.textContent=`该客户总剩余：${tH.toFixed(1)} 小时 / ¥${tA.toFixed(2)}`;
}

function addRechargeRecord(){
if(!DB.customers.length){showToast('请先添加顾客');return}
const custId=prompt('选择客户(输入序号):\n'+DB.customers.map((c,i)=>`${i+1}.${c.name}`).join('\n'));if(!custId)return;
const c=DB.customers[parseInt(custId)-1];if(!c){showToast('序号无效');return}
const cardType=prompt('卡类型(养护卡/家庭卡)：','养护卡');if(!cardType)return;
const hours=parseFloat(prompt('充值时长(小时)：')||'0');const giftHours=parseFloat(prompt('赠送时长(小时)：')||'0');const amount=parseFloat(prompt('充值金额(元)：')||'0');
const inputDate=prompt('充值日期(YYYY-MM-DD，留空=今天)：','');const date=inputDate?inputDate:new Date().toISOString().split('T')[0];
showPayDialog('充值支付方式',amount,(pay)=>{
DB.recharges.push({id:Date.now(),custId:c.id,customer:c.name,cardType,hours,giftHours,amount,date,payMethod:pay.method});saveDB();showToast('充值记录已添加（'+pay.method+'），自动保存');renderRecharge();
});
}
function deleteRecharge(id){
const r=DB.recharges.find(x=>x.id===id);if(!r)return;
const relCount=DB.deductions.filter(d=>d.rechargeId===id).length;
const msg=relCount>0?`「${r.customer}」的这笔充值有 ${relCount} 条关联扣卡记录，删除后扣卡将取消关联（不删除）。确定删除吗？`:`确定删除「${r.customer}」的这笔充值记录吗？`;
showConfirm('删除充值记录',msg,()=>{
DB.deductions.forEach(d=>{if(d.rechargeId===id)d.rechargeId=null});
DB.recharges=DB.recharges.filter(x=>x.id!==id);saveDB();showToast('已删除，自动保存');renderRecharge();
});
}

function executeDeduct(){
const custId=parseInt(document.getElementById('deductCust').value);if(!custId){showToast('请选择客户');return}
const rechargeId=parseInt(document.getElementById('deductRechargeId').value);if(!rechargeId){showToast('请选择关联充值记录');return}
const hours=parseFloat(document.getElementById('deductHours').value);if(!hours||hours<=0){showToast('请输入扣除时长');return}
const rem=calcRechargeRemaining(rechargeId);if(hours>rem.remainHours){showConfirm('剩余时长不足',`本笔充值剩余 ${rem.remainHours.toFixed(1)}h，本次需扣 ${hours}h，确认继续扣卡？`,()=>doDeduct(custId,rechargeId,hours));return}
doDeduct(custId,rechargeId,hours);
}
function doDeduct(custId,rechargeId,hours){
const unitPrice=parseFloat(document.getElementById('deductUnitPrice').value)||0;const totalPrice=parseFloat(document.getElementById('deductTotalPrice').value)||0;
const staffId=document.getElementById('deductStaff').value;const staffName=staffId?DB.staff.find(s=>s.id===parseInt(staffId))?.name||'':'';
const note=document.getElementById('deductNote').value.trim();
const cust=DB.customers.find(x=>x.id===custId);if(!cust){showToast('客户不存在');return}
const date=document.getElementById('deductDate')?.value||new Date().toISOString().split('T')[0];
DB.deductions.push({id:Date.now(),custId,rechargeId,customer:cust.name,hours,unitPrice,totalPrice,staff:staffName,date,note});
saveDB();showToast('扣卡成功，自动保存');renderRecharge();
}
function deleteDeduction(id){DB.deductions=DB.deductions.filter(x=>x.id!==id);saveDB();showToast('已删除，自动保存');renderRechargeContent()}

function saveCardType(editId=null){
const name=document.getElementById('cardName').value.trim();if(!name){showToast('请输入卡名称');return}
const data={name,type:document.getElementById('cardType').value,totalTimes:parseInt(document.getElementById('cardTotalTimes').value)||0,validity:document.getElementById('cardValidity').value};
if(editId!=null){const idx=DB.cardTypes.findIndex(x=>x.id===editId);if(idx>=0)DB.cardTypes[idx]={...DB.cardTypes[idx],...data};showToast('卡类型已更新')}
else{DB.cardTypes.push({id:Date.now(),...data});showToast('新增卡类型成功')}
saveDB();navigate('recharge');
}

const rem=calcRechargeRemaining(r.id);
const progress=rem.totalHours>0?Math.min(100,Math.round(rem.deductedHours/rem.totalHours*100)):0;
const relatedDeductions=DB.deductions.filter(d=>d.rechargeId===r.id).sort((a,b)=>b.date.localeCompare(a.date));

// 每个类别的常见支出项目（用于 datalist 快速选择）
const EXPENSE_ITEMS_BY_CAT={
'固定成本':['房租','物业费','装修折旧','设备折旧','保险费','宽带网络','软件订阅','贷款利息'],

};

// 计算指定时间范围的营收（消费营收 + 充值营收）
function calcRangeRevenue(start,end){
const inRange=date=>date&&date>=start&&date<=end;
const deductRevenue=(DB.deductions||[]).filter(d=>inRange(d.date)).reduce((s,d)=>s+(d.totalPrice||0),0);
const rechargeRevenue=(DB.recharges||[]).filter(r=>inRange(r.date)).reduce((s,r)=>s+(r.amount||0),0);
return{deductRevenue,rechargeRevenue,total:deductRevenue+rechargeRevenue};
}
// 计算盈亏平衡点（支持任意时间范围）：固定成本 / (1 - 变动成本率)
function calcBreakEven(start,end){
// 默认本月
if(!start||!end){const todayStr=new Date().toISOString().split('T')[0];const ym=todayStr.slice(0,7);start=ym+'-01';end=ym+'-31'}
const inRange=date=>date&&date>=start&&date<=end;
const list=(DB.expenses||[]).filter(e=>inRange(e.date));
const fixedCost=list.filter(e=>e.category==='固定成本').reduce((s,e)=>s+(e.amount||0),0);
const varCost=list.filter(e=>e.category==='变动成本').reduce((s,e)=>s+(e.amount||0),0);
const mgmtCost=list.filter(e=>e.category==='管理与杂项').reduce((s,e)=>s+(e.amount||0),0);
const totalCost=fixedCost+varCost+mgmtCost;
const rev=calcRangeRevenue(start,end);
const rangeRevenue=rev.total;
// 盈亏平衡点 = (固定成本+管理与杂项) / (1 - 变动成本率)，变动成本率=变动成本/营收
let breakEvenRevenueFull=0,contributionMargin=0,varCostRate=0;
if(rangeRevenue>0){varCostRate=varCost/rangeRevenue;contributionMargin=1-varCostRate}
if(contributionMargin>0&&contributionMargin<1){breakEvenRevenueFull=(fixedCost+mgmtCost)/contributionMargin}
const netProfit=rangeRevenue-totalCost;
return{fixedCost,varCost,mgmtCost,totalCost,rangeRevenue,varCostRate,contributionMargin,breakEvenRevenueFull,netProfit,deductRevenue:rev.deductRevenue,rechargeRevenue:rev.rechargeRevenue};
}

return{start,end}
}

function getDataStats(){
const c=DB.customers.length,a=DB.appointments.length,r=DB.recharges.length,d=DB.deductions.length,s=DB.staff.length,e=(DB.expenses||[]).length,rf=DB.referrals.length;

}
function backupData(){
const backup={version:APP_VERSION,date:new Date().toISOString(),db:DB,settings:SETTINGS};
const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);const a=document.createElement('a');
a.href=url;a.download='莱宝福禅拍-数据备份-'+new Date().toISOString().split('T')[0]+'.json';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
showToast('数据备份已下载，请妥善保存');
}
function restoreDataInput(){document.getElementById('restoreFileInput').click()}
function restoreData(input){
const file=input.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=function(e){try{const data=JSON.parse(e.target.result);
if(!data.db){showToast('备份文件格式不正确');return}
showConfirm('恢复数据',`即将从备份文件恢复数据：\n\n备份版本：${data.version||'未知'}\n备份日期：${(data.date||'').split('T')[0]}\n数据量：${(data.db.customers||[]).length}顾客 / ${(data.db.appointments||[]).length}预约 / ${(data.db.recharges||[]).length}充值\n\n⚠️ 当前数据将被覆盖，确定恢复吗？`,()=>{
DB=Object.assign({},data.db);saveDB();
if(data.settings){SETTINGS=Object.assign({},SETTINGS,data.settings);saveSettings();applySettingsFromStorage()}
migrateDB();showToast('数据已恢复，正在刷新...');setTimeout(()=>location.reload(),1000);
});
}catch(err){showToast('文件解析失败：'+err.message)}};
reader.readAsText(file);input.value='';
}

// 发现新版本，先自动备份
backupData();
showToast('发现新版本 '+m[1]+'，已自动备份数据，3秒后更新...',3000);
setTimeout(()=>{
localStorage.setItem('lb_app_version',m[1]);
// 清除缓存
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
sessionStorage.removeItem('lb_refreshed');
location.reload();
},3000);
}else{
showToast('当前已是最新版本 '+APP_VERSION);
}
}).catch(()=>showToast('检查更新失败，可能是离线模式，请连接网络后重试'));
}
// ============ 版本管理与数据迁移 ============
const APP_VERSION='2025.07.31.v18';// v4.3 服务记录独立留档，每次服务均生成记录同步客户档案
function migrateDB(){
// 确保所有必要字段存在，不丢失任何已有数据
if(!DB.customers)DB.customers=[];
if(!DB.appointments)DB.appointments=[];
if(!DB.staff)DB.staff=[];
if(!DB.workHours)DB.workHours=[];
if(!DB.cardTypes)DB.cardTypes=[{id:1,name:'养护卡',type:'养护卡',totalTimes:0,validity:'6个月'},{id:2,name:'家庭卡',type:'家庭卡',totalTimes:0,validity:'12个月'}];
if(!DB.recharges)DB.recharges=[];
if(!DB.deductions)DB.deductions=[];
if(!DB.onlineSales)DB.onlineSales=[];
if(!DB.onlineTraffic)DB.onlineTraffic=[];
if(!DB.offlineVisit)DB.offlineVisit=[];
if(!DB.offlineConvert)DB.offlineConvert=[];
if(!DB.referrals)DB.referrals=[];
if(!DB.channels)DB.channels=['线上','线下','转介绍'];
if(!DB.expenses)DB.expenses=[];  // v3.1 新增：店铺支出
if(!DB.serviceRecords)DB.serviceRecords=[];  // v4.3 新增：服务记录留档
// v3.2 支出框架升级：兼容旧数据，补全新字段（category/payMethod），旧 name→保留为 name（支出项目）
if(DB.expenses.length){
const oldCatMap={'房租':'固定成本','物业':'固定成本','网络':'固定成本','宽带':'固定成本','保险':'固定成本','折旧':'固定成本','贷款':'固定成本','利息':'固定成本','水电':'变动成本','物料':'变动成本','耗材':'变动成本','产品':'变动成本','进货':'变动成本','包装':'变动成本','配送':'变动成本','燃气':'变动成本','人工':'管理与杂项','工资':'管理与杂项','工资':'管理与杂项','奖金':'管理与杂项','社保':'管理与杂项','培训':'管理与杂项','办公':'管理与杂项','差旅':'管理与杂项','营销':'管理与杂项','推广':'管理与杂项','维修':'管理与杂项','交通':'管理与杂项','餐饮':'管理与杂项'};
DB.expenses.forEach(e=>{
if(!e.category||EXPENSE_CATEGORIES.indexOf(e.category)===-1){
// 尝试根据 name 推断类别
const n=(e.name||e.item||'').toLowerCase();
let guessed='管理与杂项';
for(const k in oldCatMap){if(n.indexOf(k)>=0){guessed=oldCatMap[k];break}}
e.category=e.category&&EXPENSE_CATEGORIES.indexOf(e.category)!==-1?e.category:guessed;
}
if(!e.payMethod)e.payMethod='';
// 旧数据可能用 item 字段，统一为 name
if(!e.name&&e.item)e.name=e.item;
});
}
saveDB();
}
migrateDB(); // 每次加载时执行，自动补全缺失字段
const STORED_VER=localStorage.getItem('lb_app_version');
if(STORED_VER&&STORED_VER!==APP_VERSION){
// 版本不一致，迁移数据并刷新（iOS PWA 兼容：不用 reload(true)）
migrateDB();
localStorage.setItem('lb_app_version',APP_VERSION);
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
if(!sessionStorage.getItem('lb_refreshed')){
sessionStorage.setItem('lb_refreshed','1');
location.reload();
}
}else if(!STORED_VER){
localStorage.setItem('lb_app_version',APP_VERSION);
}
// 注册 Service Worker 时跳过缓存（不注册 sw.js，避免旧缓存锁死）
// if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
// 定期检查更新（每10分钟一次）- 只在用户空闲且不操作时提醒，不自动刷新打断操作
setInterval(()=>{
if(document.hidden)return;// 页面隐藏时不检查
if(currentPage==='settings')return;// 用户在设置页时不打扰
fetch(location.href,{cache:'no-cache',headers:{'Cache-Control':'no-cache'}}).then(r=>r.text()).then(txt=>{
const m=txt.match(/APP_VERSION='([^']+)'/);
if(m&&m[1]!==APP_VERSION){
const dismissKey='lb_update_'+m[1]+'_dismissed';
if(sessionStorage.getItem(dismissKey))return;// 用户已忽略过
showToast('发现新版本 '+m[1]+'，请到系统设置中更新',5000);
sessionStorage.setItem(dismissKey,'1');
}
}).catch(()=>{});
},600000);
init();
</script>
